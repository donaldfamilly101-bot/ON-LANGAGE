name: ON-LANGAGE Android Build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check application files
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/onlangage/app/MainActivity.java
          echo "9400314f80be07aae0a7a21490d973485a21baa8290b0e62a243d44db0d681b8  app/src/main/assets/index.html" | sha256sum -c -
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:?ANDROID_HOME missing}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK"
          yes | "$SDK" --licenses >/dev/null || true
          "$SDK" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify signed release
        env:
          KEYSTORE_B64: ${{ secrets.ON_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ON_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ON_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ON_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Missing ON_KEYSTORE_BASE64}" "${KEYSTORE_PASSWORD:?Missing ON_KEYSTORE_PASSWORD}" "${KEY_ALIAS:?Missing ON_KEY_ALIAS}" "${KEY_PASSWORD:?Missing ON_KEY_PASSWORD}"
          KEY="$RUNNER_TEMP/on-langage-release.jks"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEY"
          chmod 600 "$KEY"
          gradle :app:assembleDebug :app:bundleRelease --stacktrace -PON_KEYSTORE_FILE="$KEY" -PON_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" -PON_KEY_ALIAS="$KEY_ALIAS" -PON_KEY_PASSWORD="$KEY_PASSWORD"
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/signature.txt"
          grep -F 'jar verified' "$RUNNER_TEMP/signature.txt"
      - name: Save Android outputs
        uses: actions/upload-artifact@v4
        with:
          name: ON-LANGAGE-APK-AAB
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
